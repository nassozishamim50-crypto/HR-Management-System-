<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- Background transparent / clean -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#142165" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- SCT Main Logotype Group -->
  <g id="sct-letters">
    <!-- Letter S (Dynamic Curved S with deep blue outline and bright yellow fill) -->
    <!-- Outer stroke layer -->
    <path d="M 230 85 C 205 60, 160 65, 140 85 C 115 110, 120 155, 165 175 C 190 186, 215 198, 222 215 C 235 245, 205 275, 160 270 C 130 266, 115 245, 110 225 L 85 240 C 95 280, 125 305, 175 305 C 240 305, 275 260, 255 205 C 242 175, 210 160, 172 142 C 145 130, 145 105, 162 95 C 178 85, 205 85, 222 102 Z"
          fill="#FFDE00" stroke="#162365" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Letter C (Nestled under the S top curve) -->
    <path d="M 320 120 C 310 95, 280 85, 255 95 C 225 108, 215 150, 225 185 C 235 220, 265 240, 295 235 C 320 230, 335 210, 340 190 L 305 180 C 302 195, 292 205, 275 205 C 255 205, 248 185, 245 165 C 242 145, 248 122, 268 118 C 285 115, 295 125, 302 140 Z"
          fill="#FFDE00" stroke="#162365" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Letter T (Strong Block T standing tall) -->
    <path d="M 325 80 L 440 80 L 440 125 L 400 125 L 400 295 L 350 295 L 350 125 L 325 125 Z"
          fill="#FFDE00" stroke="#162365" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- Child Boy Illustration on the S -->
  <g id="boy-illustration">
    <!-- Boy Legs / Shorts (Yellow) -->
    <rect x="135" y="215" width="22" height="24" rx="3" fill="#FFDE00" stroke="#162365" stroke-width="3.5" />
    <line x1="146" y1="215" x2="146" y2="239" stroke="#162365" stroke-width="3" />

    <!-- Boy Shoes -->
    <ellipse cx="140" cy="242" rx="6" ry="4" fill="#162365" />
    <ellipse cx="152" cy="242" rx="6" ry="4" fill="#162365" />

    <!-- Boy Torso / Shirt (Royal Deep Blue) -->
    <path d="M 125 178 L 167 178 L 163 216 L 129 216 Z" fill="#162365" stroke="#162365" stroke-width="2" />

    <!-- Boy Outstretched Arms -->
    <!-- Left arm -->
    <path d="M 127 182 L 105 182" stroke="#8D5524" stroke-width="7" stroke-linecap="round" />
    <circle cx="102" cy="182" r="5" fill="#8D5524" />
    <!-- Right arm -->
    <path d="M 165 182 L 187 182" stroke="#8D5524" stroke-width="7" stroke-linecap="round" />
    <circle cx="190" cy="182" r="5" fill="#8D5524" />

    <!-- Boy Head & Neck -->
    <rect x="141" y="172" width="10" height="8" fill="#8D5524" />
    <circle cx="146" cy="158" r="17" fill="#8D5524" stroke="#162365" stroke-width="3" />

    <!-- Boy Hair (curly / short black) -->
    <path d="M 130 156 C 130 142, 142 140, 146 140 C 150 140, 162 142, 162 156 C 160 145, 150 144, 146 144 C 142 144, 132 145, 130 156 Z" fill="#162365" />
    <circle cx="134" cy="147" r="3" fill="#162365" />
    <circle cx="141" cy="144" r="3.5" fill="#162365" />
    <circle cx="148" cy="144" r="3.5" fill="#162365" />
    <circle cx="156" cy="147" r="3" fill="#162365" />

    <!-- Boy Face (Eyes & Smile) -->
    <circle cx="141" cy="158" r="2.2" fill="#162365" />
    <circle cx="151" cy="158" r="2.2" fill="#162365" />
    <path d="M 142 165 Q 146 170 150 165" fill="none" stroke="#162365" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Child Girl Illustration peeking from the T -->
  <g id="girl-illustration">
    <!-- Girl Dress (Yellow) -->
    <path d="M 395 210 L 415 210 L 420 260 L 395 260 Z" fill="#FFDE00" stroke="#162365" stroke-width="3.5" />

    <!-- Girl Legs -->
    <line x1="403" y1="260" x2="403" y2="282" stroke="#8D5524" stroke-width="5" stroke-linecap="round" />
    <line x1="412" y1="260" x2="412" y2="282" stroke="#8D5524" stroke-width="5" stroke-linecap="round" />
    <ellipse cx="403" cy="285" rx="5" ry="3.5" fill="#162365" />
    <ellipse cx="414" cy="285" rx="5" ry="3.5" fill="#162365" />

    <!-- Girl Peeking Head & Hair -->
    <circle cx="415" cy="170" r="17" fill="#8D5524" stroke="#162365" stroke-width="3" />

    <!-- Pigtails / Buns with scrunchies -->
    <circle cx="400" cy="153" r="8" fill="#162365" />
    <circle cx="430" cy="156" r="8" fill="#162365" />
    <circle cx="403" cy="159" r="3" fill="#FFDE00" />
    <circle cx="427" cy="162" r="3" fill="#FFDE00" />

    <!-- Girl Face (Eyes & Big Smile) -->
    <circle cx="411" cy="170" r="2.2" fill="#162365" />
    <circle cx="421" cy="170" r="2.2" fill="#162365" />
    <path d="M 412 176 Q 417 182 422 176" fill="none" stroke="#162365" stroke-width="2.5" stroke-linecap="round" />

    <!-- Girl Hand holding the edge of T -->
    <ellipse cx="394" cy="215" rx="5" ry="4" fill="#8D5524" stroke="#162365" stroke-width="2" />
  </g>

  <!-- Official Brand Wordmark underneath -->
  <text x="250" y="360"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="34"
        letter-spacing="0.5"
        fill="#162365">Special Children's Trust</text>
</svg>
